syntax = "proto3";

package doppelganger;

import "sys/spec.proto";

option (spec.service) = {name: "doppelganger", tenant_owned: true};

// ---------------------------------------------------------------------------
// Doppelganger: a fleet service that answers questions on Jody's behalf from
// the jody context repo. Its only role is to answer. Callers open a session,
// give context (who they are, who the answer is for, what it is for), and ask.
// Pushback is just the next GenerateAnswer in the same session: it re-answers
// with whatever the caller added; it does not repeat itself.
//
// One instance per tenant (tenant_owned), shared by that tenant's users; the
// gateway routes each caller to their tenant's instance. Client-facing (C2S):
// the caller is an authenticated user of the tenant. Answers rest on two
// layers of context held by the instance: the tenant's (UpdateTenantContext,
// a tenant-admin entitlement) and the calling user's own (UpdateContext, any
// user, their own files only). The model is reached through llmproxy over S2S;
// doppelganger holds no model credential. Context lives on the instance's
// disk until stratum is ported, when it moves there.
// ---------------------------------------------------------------------------

// The model call goes through llmproxy; the fleet build admits doppelganger as
// one of its callers because this line exists.
option (spec.grpc_s2s_client) = {service: "llmproxy.LlmProxy"};

message Config {
  option (spec.grpc_config) = {service_name: "doppelganger"};

  // repo_dir holds the context the answers rest on: tenant/ for the tenant's
  // shared context and users/<user>/ for each user's own, both written only
  // through this service's Update*Context RPCs and read on every answer.
  string repo_dir = 1 [(spec.assert_required) = true];
  // state_dir holds session state (context and turns), one file per session.
  string state_dir = 2 [(spec.assert_required) = true];
  // model_alias is the llmproxy alias answers are generated with.
  string model_alias = 3 [(spec.assert_required) = true];
}

message CreateSessionRequest {
  // Optional context given at creation. More can be added with UpdateSession.
  repeated string context = 1 [(spec.assert_max_size) = 100];
}

message CreateSessionResponse {
  string session_id = 1 [(spec.assert_required) = true];
}

message UpdateSessionRequest {
  string          session_id = 1 [(spec.assert_required) = true];
  // Context to append. Existing context is kept.
  repeated string context    = 2 [(spec.assert_max_size) = 100];
}

message UpdateSessionResponse {}

// ContextFile is one file of a context: a repository-relative path and its
// content. Only Markdown (.md) is read into answers; anything else is kept
// but ignored.
message ContextFile {
  string path    = 1 [(spec.assert_required) = true, (spec.assert_max_size) = 512];
  bytes  content = 2;
}

// UpdateContextRequest replaces the calling user's own context, whole: the
// files given are the context afterwards, nothing else. An empty list clears it.
message UpdateContextRequest {
  repeated ContextFile files = 1 [(spec.assert_max_size) = 4096];
}

message UpdateContextResponse {
  int32 file_count = 1;
  int64 byte_count = 2;
}

// UpdateTenantContextRequest replaces the tenant's shared context, whole.
message UpdateTenantContextRequest {
  repeated ContextFile files = 1 [(spec.assert_max_size) = 4096];
}

message UpdateTenantContextResponse {
  int32 file_count = 1;
  int64 byte_count = 2;
}

message GenerateAnswerRequest {
  string session_id = 1 [(spec.assert_required) = true];
  string question   = 2 [(spec.assert_required) = true];
}

enum AnswerKind {
  ANSWER_KIND_UNSPECIFIED      = 0;
  ANSWER_KIND_ANSWER           = 1;  // act on it
  ANSWER_KIND_NEEDS_CONTEXT    = 2;  // tell us more (see missing), then ask again
  ANSWER_KIND_BLOCKED_ON_HUMAN = 3;  // only Jody can answer; treat as a blocker, keep working
}

enum Provenance {
  PROVENANCE_UNSPECIFIED = 0;
  PROVENANCE_QUOTED      = 1;  // quotes something Jody said
  PROVENANCE_DERIVED     = 2;  // derived from a stated principle; not said by Jody
}

message GenerateAnswerResponse {
  AnswerKind      kind              = 1 [(spec.assert_enum_defined) = true];
  string          answer            = 2;
  // Why. Gives the caller something to push back on.
  string          reasoning         = 3;
  // What would change this answer.
  string          would_change_mind = 4;
  Provenance      provenance        = 5;
  // Sources in the jody repo the answer rests on (file paths, quotes).
  repeated string sources           = 6 [(spec.assert_max_size) = 100];
  // For NEEDS_CONTEXT: what the caller must tell us.
  repeated string missing           = 7 [(spec.assert_max_size) = 100];
}

service Doppelganger {
  option (spec.service_c2s) = {};

  // Opens a question session. Give context up front: who you are, who the
  // answer is for, and what it is for. Returns the session_id every later
  // call needs.
  rpc CreateSession(CreateSessionRequest) returns (CreateSessionResponse) {
    option (spec.rpc) = {flags: [RPC_FLAG_AUTH_ANY_USER]};
  }
  // Adds context to an open session, for example what NEEDS_CONTEXT asked
  // for. Nothing is answered here; ask again afterwards.
  rpc UpdateSession(UpdateSessionRequest) returns (UpdateSessionResponse) {
    option (spec.rpc) = {flags: [RPC_FLAG_AUTH_ANY_USER]};
  }
  // Answers one question in a session as the person the context describes
  // would, from the tenant's context and the caller's own, with reasoning,
  // provenance and sources. Asking again in the same session with more context
  // is how to push back; it does not repeat itself. A session belongs to the
  // user who opened it.
  rpc GenerateAnswer(GenerateAnswerRequest) returns (GenerateAnswerResponse) {
    option (spec.rpc) = {flags: [RPC_FLAG_AUTH_ANY_USER]};
  }
  // Replaces the calling user's own context with the files given. Any user of
  // the tenant may do this; it reaches only their own context.
  rpc UpdateContext(UpdateContextRequest) returns (UpdateContextResponse) {
    option (spec.rpc) = {flags: [RPC_FLAG_AUTH_ANY_USER]};
  }
  // Replaces the tenant's shared context with the files given. Entitlement
  // gated: the caller's token must carry this RPC's grant, which the tenant's
  // ceiling must allow.
  rpc UpdateTenantContext(UpdateTenantContextRequest) returns (UpdateTenantContextResponse) {
    option (spec.rpc) = {};
  }
}
